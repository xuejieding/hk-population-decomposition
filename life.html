<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="Role cards for a CCCH9015 classroom game on work and family in Hong Kong.">
<title>Can We Build a Life Together?</title>
<style>:root{
  --bg:#FFFFFF;--ink:#1E2A3B;--muted:#5E6878;--navy:#14285A;--line:#E3E7EE;--panel:#F6F8FB;
  --A:#2457B0;--A-t:#EAF1FB;--B:#A3323A;--B-t:#FBEDEE;--C:#2E6B45;--C-t:#ECF5EE;--D:#A0620F;--D-t:#FCF3E6;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12161D;--ink:#E8ECF2;--muted:#A2ABB9;--navy:#C9D6F5;--line:#2A313C;--panel:#1A2029;
    --A:#8FB2F0;--A-t:#1B2740;--B:#EE9AA0;--B-t:#3A1E22;--C:#8FCFA5;--C-t:#18301F;--D:#E9B86A;--D-t:#3A2A12;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--sans)}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
a{color:inherit}
h1,h2,h3{font-family:var(--serif);color:var(--navy);line-height:1.2;margin:0}
h1{font-size:30px}
h2{font-size:22px;margin:28px 0 10px}
.kicker{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.sub{font-family:var(--serif);font-size:19px;color:var(--muted);margin:6px 0 16px}
.lead{margin:0 0 8px}
ol.steps{padding-left:22px;margin:8px 0}
ol.steps li{margin:6px 0}
ul.parts{padding-left:20px;margin:6px 0}
ul.parts li{margin:4px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 8px}
.hh{display:block;text-decoration:none;border-radius:14px;padding:18px 16px;background:var(--t);border:2px solid var(--a)}
.hh .letter{font-family:var(--serif);font-size:40px;line-height:1;color:var(--a);font-weight:bold}
.hh .lbl{display:block;margin-top:6px;font-size:15px;color:var(--ink)}
.trio{display:block;text-decoration:none;text-align:center;border:1px dashed var(--muted);border-radius:12px;padding:12px;margin:4px 0 12px;color:var(--ink)}
.small{font-size:14px;color:var(--muted)}
.back{display:inline-block;font-size:15px;color:var(--muted);text-decoration:none;margin-bottom:14px}
.back:hover{text-decoration:underline}
.role-btn{display:block;text-decoration:none;border-radius:14px;padding:16px;margin:12px 0;background:var(--t);border:2px solid var(--a)}
.role-btn b{display:block;font-family:var(--serif);font-size:22px;color:var(--a)}
.role-btn span{font-size:15px}
.warn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;margin:12px 0}
.card-head{border-radius:16px;padding:18px 16px;background:var(--t);margin-bottom:10px}
.chip{display:inline-block;font-weight:bold;font-size:14px;color:var(--bg);background:var(--a);border-radius:999px;padding:2px 10px;margin-bottom:8px}
.card-head h1{font-size:32px}
.card-head .role{font-size:17px;color:var(--ink);margin-top:4px}
.tagline{font-family:var(--serif);font-style:italic;color:var(--muted);margin-top:6px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.facts span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:14px}
.together{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 16px;background:var(--panel)}
.label{display:block;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--a);margin-bottom:2px;font-weight:bold}
.together .label + span{display:block;margin-bottom:10px}
.tonight{font-weight:600}
.sec{margin:0 0 14px}
.sec p{margin:0}
.bottom{border:2px solid var(--a);border-radius:12px;padding:12px 14px;margin:14px 0}
.bottom p{margin:2px 0 0;font-weight:600}
.give{border-radius:12px;padding:12px 14px;margin:14px 0;background:var(--t)}
.give ul{margin:4px 0 0;padding-left:20px}
.give li{margin:4px 0}
.ask{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0}
.ask q{font-family:var(--serif);font-size:19px;quotes:"“" "”"}
details{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:var(--bg)}
details.secret{border:2px dashed var(--a);margin:14px 0 22px}
summary{cursor:pointer;padding:12px 14px;font-weight:600;color:var(--navy);list-style:none}
details.secret summary{color:var(--a)}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";float:right;color:var(--muted)}
details[open] summary::after{content:"−"}
details .body{padding:0 14px 12px}
details ol,details ul{padding-left:20px;margin:6px 0}
details li{margin:6px 0}
.timing{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.timing span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:6px 0}
.opt b{font-family:var(--serif);color:var(--navy)}
footer{margin-top:28px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}</style>
</head>

, "text": "YES, MAYBE or NO, and one main reason."}], "deal_questions": ["Where do we live?", "Whose job changes?", "Who covers the Tuesday?", "What do we owe our parents?"], "timing": [["Read your card", "3 min"], ["Tell your stories", "4 min"], ["Cards on the table", "3 min"], ["Make a deal", "10 min"], ["Decide", "3 min"]], "rules": [{"title": "Defend your bottom line, trade the rest", "text": "Stay in character. Your bottom line is real: don’t drop it just to finish. Everything else can be traded, but say what persuaded you."}, {"title": "Don’t invent resources, and speak for yourself", "text": "If it isn’t on your card, it doesn’t exist: no extra money, flats, helpers, helpful grandparents or flexible employers. Anything in the Hong Kong reality check can be paid for. Never promise your partner’s (or a parent’s) time, money, home or job change: ask them."}, {"title": "You don’t have to make it work", "text": "Finish with YES, MAYBE or NO and one main reason. YES needs a deal you both accept: who gives what. MAYBE needs “if … by when”. NO names the bottom lines that collided. There are no extra marks for staying together."}], "tuesday_test": {"title": "The Tuesday test", "text": "Take a Tuesday when your child is 18 months old. Who covers 7–9 am, 9 am–6 pm, 6–10 pm and the night? Your child has a fever on a workday: who stays home?"}, "reality": [{"label": "Live-in domestic helper", "text": "About HK$7,000 a month in total (minimum wage HK$5,220 for new contracts, plus food and insurance). The helper must live in your home, with their own place to sleep: not the living room or a corridor."}, {"label": "Full-day childcare (under 3)", "text": "About HK$6,000–10,000 a month, roughly 8 am–6 pm. Places near home often have a waiting list."}, {"label": "Renting", "text": "Two bedrooms (about 450 sq ft): HK$20,000–25,000 in the urban area, HK$13,000–17,000 in the New Territories. Three bedrooms with space for a helper (about 700 sq ft), urban: HK$35,000 or more."}, {"label": "Buying", "text": "A HK$6 million flat needs a deposit of HK$600,000–1.2 million, then about HK$22,000–25,000 a month in mortgage payments."}, {"label": "Care home for an older person", "text": "Private: about HK$10,000–20,000 a month. Subsidised places usually mean waiting a year or more."}], "reality_note": "Rough teaching figures, not official prices.", "stress_test": {"title": "Finished early? Stress-test your deal", "items": ["Who does the 7 am school run?", "Who stays home when your child is sick?", "Who takes a parent to the clinic on a weekday morning?", "If this arrangement stops working, whose job changes first?", "What would your character regret in ten years?"]}, "decision": {"title": "Your decision", "options": [["YES", "a deal you both accept: who gives what"], ["MAYBE", "it could work if … by when"], ["NO", "name the bottom lines that collided"]], "after": "Agree on one main reason. Be ready to raise your hand."}, "disclaimer": "The people, incomes and circumstances are fictional teaching examples, not averages, advice or official policy. Most incomes here are above the median for 25–34-year-olds in Hong Kong (about HK$23,000 a month). You never need to share your own relationship or family.", "households": [{"id": "A", "together": "You have been together for five years and rent a two-bedroom, 450 sq ft flat in Sai Ying Pun for HK$24,000 a month, split 50/50. If a baby took the second bedroom, a live-in helper would have nowhere to sleep.", "tonight": "A headhunter needs Kit’s answer by Friday. Jo’s principal wants an answer about a promotion by Monday. Jo turns 32 next month.", "cards": [{"id": "A1", "name": "Kit Chan", "age": 31, "role": "Investment banking associate", "tagline": "The deal-maker who hasn’t had a free weekend since Lunar New Year.", "facts": ["HK$90,000 a month + bonus", "65–75 hours a week, no working from home", "Savings HK$1.2 million"], "story": "You grew up in a subdivided flat above your parents’ stationery shop in Sham Shui Po, listening to them argue about rent. Now you earn HK$90,000 a month plus a bonus, and since last year you have paid the shop’s rent (HK$8,000 a month) so they can keep going. The price: 65–75 hours a week, deals that blow up at midnight, a week a month in Singapore or Shanghai. You have cancelled the same Japan trip with Jo twice. Your managing director says you will make Vice-President within two years, “if you keep this pace”. Then a headhunter called: an in-house finance job at a large company, HK$60,000, about 45 hours, weekends free. Your parents work seven days a week; they can’t help with a baby.", "bottom_line": "You will not give up the VP track for a vague promise. If you switch jobs, it must be for a concrete plan: a date to start trying for a baby, and a home with room for help.", "give": ["Take the in-house job: HK$30,000 a month less, and the end of the VP track.", "Stay in banking, but pay for a bigger flat and a live-in helper.", "Promise one fixed evening a week at home (your boss won’t like it)."], "ask_to": "Jo", "ask": "If I pay for the help, why do I also have to be home by seven?", "secret": "You already have a second interview for the in-house job on Thursday. You haven’t decided whether to go."}, {"id": "A2", "name": "Jo Wong", "age": 31, "role": "Secondary school teacher", "tagline": "The teacher whose Form 5 class still messages after exams.", "facts": ["HK$46,000 a month", "About 50 hours a week in term; holidays free", "Savings HK$300,000"], "story": "You teach Citizenship and Social Development at an aided school in Kwun Tong, and you are good at it: your Form 5 class still messages you after exams. In term you are at school 7:30 am–5 pm and mark until ten; in the holidays you finally breathe. Your principal wants to make you senior teacher and head of department next September: about HK$5,000 more a month, but more meetings, evening events and some Saturdays. You love Kit, but you are tired of eating dinner alone and getting “sorry, deal blew up” texts at 9 pm. Your mother (63), widowed, lives alone in Lam Tin. She has offered to mind a baby two or three days a week, but her back is bad. You give her HK$5,000 a month.", "bottom_line": "You will not become the “default parent” just because your job looks flexible. If you have a child, Kit must be home for bedtime at least three nights a week.", "give": ["Turn down the head-of-department promotion, for now.", "Accept a live-in helper, but only in a flat where the helper has a real room.", "Wait one more year, but not past 33."], "ask_to": "Kit", "ask": "Which three nights a week would actually be yours?", "secret": "At Mid-Autumn dinner you told your mother you would “probably try for a baby next year”. She has already told the neighbours."}]}, {"id": "B", "together": "You have been together for four years and plan to marry next year. You rent a 380 sq ft one-bedroom flat in Mong Kok for HK$15,000 a month, split 50/50. You have no children.", "tonight": "Jordan’s company needs an answer about a promotion to Shenzhen by the end of next week.", "cards": [{"id": "B1", "name": "Jordan Lee", "age": 30, "role": "Product manager at a tech company", "tagline": "The one with a spare room waiting across the border.", "facts": ["HK$52,000 a month (HK$70,000 if promoted)", "About 45 hours a week; 2 days from home", "Savings HK$500,000"], "story": "You grew up between Shenzhen and Hong Kong. Three years ago your parents retired to a three-bedroom flat in Futian, Shenzhen, with a river view and a spare room they keep calling “the baby’s room”. You are a product manager at a tech company (HK$52,000, about 45 hours, two days a week from home). Now the company has offered you the job you have wanted for five years: lead a new team in Qianhai, Shenzhen, for HK$70,000 a month, in the Shenzhen office four days a week from next spring, with half your Shenzhen rent paid for two years. A three-bedroom near your parents costs about HK$12,000 a month. Your parents would look after a baby every weekday, but only in Shenzhen.", "bottom_line": "You will not turn down Qianhai without trying it. A chance like this won’t come back.", "give": ["Keep living in Hong Kong and cross the border four days a week (about 90 minutes each way).", "Try Shenzhen for one year, then decide together.", "Pay for a helper, so your parents aren’t the only plan."], "ask_to": "Casey", "ask": "If not my parents, then who?", "secret": "Every night you look at flats near your parents online. You have found one you love."}, {"id": "B2", "name": "Casey Ho", "age": 30, "role": "Registered social worker", "tagline": "The one the old ladies at the centre save egg tarts for.", "facts": ["HK$40,000 a month", "9 am–6 pm weekdays + one Saturday a month", "Savings HK$200,000"], "story": "You work at an NGO elderly centre in Sham Shui Po (HK$40,000, 9 am–6 pm, plus one Saturday a month), and the old ladies there save egg tarts for you. Your supervisor wants to recommend you to run the centre next year (about HK$48,000). Your job and your social work registration are in Hong Kong; in Shenzhen you would be starting again. Last year your father (67) had a stroke. Your mother (64) cares for him and is exhausted; your only sibling works in Singapore and sends money, not time. Every Saturday you take your father to physiotherapy, and you visit two evenings a week. You give your parents HK$6,000 a month. From Futian, their flat would be 60–90 minutes away.", "bottom_line": "You will not live more than an hour from your parents while your father needs you every week.", "give": ["Live apart on weekdays for two years while Jordan works in Shenzhen.", "Turn down running the centre next year.", "Spend some weekends in Shenzhen, if Jordan takes your father to physiotherapy once a month."], "ask_to": "Jordan", "ask": "Would you turn down Qianhai to stay near my parents?", "secret": "You are not sure you want children at all. Caring for your father has shown you how care can swallow a life. You have never said this out loud."}]}, {"id": "C", "together": "You have been together for four years and want to marry next year. Wing lives with Wing’s mother in her public-housing flat in Kwun Tong; Robin lives with Robin’s parents in Tai Po. Together you have saved HK$800,000 towards a home.", "tonight": "On Saturday you will view two flats at about the same price (HK$6.8 million): a two-bedroom ten minutes from Wing’s mother in Kwun Tong, and a three-bedroom near Robin’s parents in Tai Po. You can afford one deposit.", "cards": [{"id": "C1", "name": "Wing Lau", "age": 32, "role": "Senior accountant at an audit firm", "tagline": "The only child who made a promise at a hospital bed.", "facts": ["HK$48,000 a month", "About 50 hours a week; 70 + Saturdays Jan–Apr", "HK$500,000 of the couple’s savings"], "story": "Four years ago, at your father’s hospital bed, you promised him you would look after your mother. You are an only child. She is 66, has diabetes, and lately forgets things: twice she missed her medicine, once she got lost coming home from the market. You take leave to go with her to the clinic two weekday mornings a month, and you give her HK$6,000 a month. You are a senior accountant at an audit firm (HK$48,000, about 50 hours a week; 70 hours and Saturdays from January to April). Because of her appointments, your manager has offered you a four-day week for one year at 80% pay (HK$38,400). Your mother would love to mind a grandchild, and she says she will never leave her flat.", "bottom_line": "You will not live more than 15 minutes from your mother, and you will not put her in a care home.", "give": ["Take the four-day week (HK$9,600 a month less).", "Wait two more years for a child.", "Ask your mother to have her memory checked before she minds a baby on her own."], "ask_to": "Robin", "ask": "Could your work-from-home days cover Mum’s clinic mornings?", "secret": "Last week your mother left the gas on. Nothing happened. You haven’t told anyone."}, {"id": "C2", "name": "Robin Cheung", "age": 31, "role": "Data analyst at a bank", "tagline": "The youngest of three, who swore to have a home with one set of rules.", "facts": ["HK$45,000 a month", "9 am–6 pm; 2 days from home (online all day)", "HK$300,000 of the couple’s savings"], "story": "You are the youngest of three and grew up in a crowded flat where your grandmother’s rules were the only rules. You swore you would one day have a home of your own. You are a data analyst at a bank (HK$45,000, 9 am–6 pm). You work from home two days a week, but on those days you must be online all day. You have been offered team lead (HK$55,000), but it ends working from home and adds two evening calls a week with London. Your parents (both 63) are healthy, retired and finally travelling: Japan in spring, Hokkaido in winter. They want grandchildren but have said clearly: “We raised three. Now it’s our turn.” They could help one day a week. You give them HK$4,000 a month.", "bottom_line": "You will not live with a parent, yours or Wing’s.", "give": ["Turn down team lead, to keep working from home two days a week.", "Live near Wing’s mother, in the Kwun Tong flat.", "Take Wing’s mother to the clinic once a month."], "ask_to": "Wing", "ask": "Where do we live, and whose rules?", "secret": "Your parents have offered HK$500,000 towards the deposit, but only if you buy the Tai Po flat near them."}, {"id": "C3", "name": "Lau Mei-fong", "age": 66, "role": "Wing’s mother", "trio_only": true, "together_label": "The couple", "together": "Wing and Robin have been together for four years and want to marry next year. Wing lives with you in your public-housing flat in Kwun Tong; Robin lives with Robin’s parents in Tai Po. Together they have saved HK$800,000 towards a home.", "tonight": "On Saturday they will view two flats: one ten minutes from you in Kwun Tong, one near Robin’s parents in Tai Po. They want your view tonight.", "tagline": "Thirty years in the same flat, and not moving now.", "facts": ["Old Age Living Allowance + HK$6,000 from Wing", "Public-housing flat in Kwun Tong", "Diabetes, controlled with medicine"], "story": "You have lived in the same public-housing flat in Kwun Tong for 30 years. Your friends, your morning tai chi group and your temple are all within five minutes. Since your husband died, Wing has fussed over you: the clinic, the pills, the phone calls every evening. You would love to mind a grandchild at your flat on weekdays; you raised Wing, after all. You do not want to move in with the couple (“I don’t want to live by someone else’s rules, or be a burden”), and you don’t want a stranger living in your small flat. You know you forget things sometimes; at 66, who doesn’t? You worry that Wing is giving up too much for you.", "bottom_line": "You will not leave your flat.", "give": ["Mind a baby two or three weekdays at your flat.", "Let Robin take you to the clinic, so Wing doesn’t lose work.", "See a doctor about your memory, if they ask you kindly."], "ask_to": "both of them", "ask": "What exactly do you expect from me, and for how many years?", "secret": "Last week you left the gas on. Nothing happened, but you were frightened. You hope Wing didn’t notice."}]}, {"id": "D", "together": "You have been together for six years and married last year. You live with Chris’s parents in their 400 sq ft two-bedroom flat in Tin Shui Wai, in Chris’s old bedroom. You have lost the Home Ownership Scheme ballot twice. Family income must be under HK$60,000 a month; the next round is next year, and a flat would need a deposit of roughly HK$300,000. Together you have saved HK$150,000.", "tonight": "Chris’s day-job offer expires on Friday. Jamie wants to stop waiting and try for a baby this year.", "cards": [{"id": "D1", "name": "Chris Ng", "age": 29, "role": "Railway maintenance technician", "tagline": "The night-shift engineer who keeps the trains running while Hong Kong sleeps.", "facts": ["HK$30,000 a month incl. night allowance", "12:30–6:30 am, five nights; sleep 8 am–3 pm", "Shared savings HK$150,000"], "story": "While Hong Kong sleeps, you walk the tracks with a torch: 12:30–6:30 am, five nights a week, often weekends, for HK$30,000 a month including the night allowance. You sleep from 8 am to 3 pm in your childhood bedroom, which is now also Jamie’s. As a child you watched your father argue with debt collectors at the door; you swore your own child never would. Stay on nights and you could be a supervisor in about two years (around HK$36,000). A property-management company has offered you a day job: HK$23,000, 8 am–6 pm, Monday to Saturday. Your father (61) is a security guard on 12-hour shifts. Your mother (58) cleans at a mall in the mornings; she could mind a baby in the afternoons, but she needs her job.", "bottom_line": "No baby until you have saved at least HK$300,000: enough for a Home Ownership Scheme deposit.", "give": ["Take the day job, so you are home in the evenings (HK$7,000 a month less).", "Work extra night shifts to save faster.", "Ask your mother to give up her morning job, if you replace her income."], "ask_to": "Jamie", "ask": "If we have a baby now, which of us changes jobs, and how do we pay for it?", "secret": "Your supervisor has hinted the promotion could come next year. With it, your family income would go over the Home Ownership Scheme limit."}, {"id": "D2", "name": "Jamie Tse", "age": 29, "role": "Store supervisor at a cosmetics chain", "tagline": "Six years of “when we can afford it”.", "facts": ["HK$22,000 + about HK$3,000 commission", "11 am–9 pm; weekends always", "Shared savings HK$150,000"], "story": "You run the floor at a cosmetics store: HK$22,000 a month plus about HK$3,000 commission, 11 am–9 pm, weekends always, and two days off that change every week. You and Chris share a bed but rarely a waking hour; you eat dinner with your in-laws more often than with Chris. Your parents divorced when you were ten; your mother (55) works evenings as a restaurant cashier and can’t help. You have been waiting “until we can afford it” for six years. Last month your best friend had her second baby. You have been offered assistant manager in Tsim Sha Tsui (about HK$28,000 with commission, closing at 10:30 pm, a longer commute), or an office admin job elsewhere (HK$18,000, 9 am–6 pm, weekdays).", "bottom_line": "You will not wait more than two more years to try for a child.", "give": ["Take the office job, so you are home every evening (HK$7,000 a month less).", "Take assistant manager to save faster, even though you would be home later.", "Keep living with Chris’s parents for now."], "ask_to": "Chris", "ask": "When would we actually see each other, let alone a baby?", "secret": "You have a separate savings account you call the “baby fund”: HK$40,000 so far. Chris doesn’t know."}]}]}</script>

function extras() {
  const rounds = D.rounds.map(r =>
    `<li><b>${esc(r.title)}</b> <span class="small">· ${esc(r.time)}</span><br>${esc(r.text)}</li>`).join('');
  const dq = D.deal_questions.map(q => `<li>${esc(q)}</li>`).join('');
  const rules = D.rules.map(r => `<li><b>${esc(r.title)}.</b> ${esc(r.text)}</li>`).join('');
  const real = D.reality.map(r => `<li><b>${esc(r.label)}.</b> ${esc(r.text)}</li>`).join('');
  const stress = D.stress_test.items.map(s => `<li>${esc(s)}</li>`).join('');
  const opts = D.decision.options.map(o => `<b>${esc(o[0])}</b><span>${esc(o[1])}</span>`).join('');
  return `
  <details><summary>How the conversation goes</summary><div class="body"><ol>${rounds}</ol>
    <p><b>Your deal must answer:</b></p><ul>${dq}</ul>
    <p><b>${esc(D.tuesday_test.title)}.</b> ${esc(D.tuesday_test.text)}</p></div></details>
  <details><summary>Three rules</summary><div class="body"><ol>${rules}</ol></div></details>
  <details><summary>Hong Kong reality check</summary><div class="body"><ul>${real}</ul>
    <p class="small">${esc(D.reality_note)}</p></div></details>
  <details><summary>${esc(D.stress_test.title)}</summary><div class="body"><ul>${stress}</ul></div></details>
  <details><summary>${esc(D.decision.title)}</summary><div class="body"><div class="opt">${opts}</div>
    <p>${esc(D.decision.after)}</p></div></details>`;
}

function footer() {
  return `<footer>${esc(D.meta.course_line)}<br>${esc(D.disclaimer)}</footer>`;
}

function home() {
  const steps = D.howto.map(s => `<li>${esc(s)}</li>`).join('');
  const tiles = D.households.map(h =>
    `<a class="hh" style="${vars(h.id)}" href="#${h.id}"><span class="letter">${h.id}</span>
     <span class="lbl">Household ${h.id}</span></a>`).join('');
  const parts = D.card_parts.map(p => `<li><b>${esc(p[0])}:</b> ${esc(p[1])}</li>`).join('');
  const timing = D.timing.map(t => `<span>${esc(t[0])} · ${esc(t[1])}</span>`).join('');
  return `
  <p class="kicker">${esc(D.meta.course_line)}</p>
  <h1>${esc(D.meta.title)}</h1>
  <p class="sub">${esc(D.meta.subtitle)}</p>
  <p class="lead">${esc(D.lead)}</p>
  <h2>Find your card</h2>
  <ol class="steps">${steps}</ol>
  <div class="grid">${tiles}</div>
  <a class="trio" href="#C">Household of three? Open <b>Household C</b>.</a>
  <p class="small">${esc(D.backup_rule)}</p>
  <h2>Your card</h2>
  <ul class="parts">${parts}</ul>
  <div class="timing">${timing}</div>
  ${extras()}
  ${footer()}`;
}

function household(id) {
  const h = hhById[id];
  const seat = ['I’m sitting on the LEFT', 'I’m sitting on the RIGHT', 'Household of three only: the third person'];
  const btns = h.cards.map((c, i) =>
    `<a class="role-btn" style="${vars(id)}" href="#${c.id}"><b>Card ${i + 1}</b><span>${seat[i]}</span></a>`).join('');
  return `
  <a class="back" href="#">← All households</a>
  <p class="kicker">${esc(D.meta.title)}</p>
  <h1>Household ${id}</h1>
  <div class="warn">Open <b>only your own card</b>. Don’t show your screen: introduce yourself to your partner in character.</div>
  ${btns}
  ${footer()}`;
}

function card(id) {
  const {hh, card: c} = cardById[id];
  const facts = c.facts.map(f => `<span>${esc(f)}</span>`).join('');
  const give = c.give.map(g => `<li>${esc(g)}</li>`).join('');
  const both = c.ask_to === 'both of them';
  const who = both ? 'Ask both of them' : `Ask ${esc(c.ask_to)}`;
  const untold = both ? 'Something you haven’t told them yet.' : `Something you haven’t told ${esc(c.ask_to)} yet.`;
  return `
  <div style="${vars(hh.id)}">
  <a class="back" href="#${hh.id}">← Household ${hh.id}</a>
  <div class="card-head"><span class="chip">${c.id}</span>
    <h1>${esc(c.name)}, ${c.age}</h1><div class="role">${esc(c.role)}</div>
    <div class="tagline">${esc(c.tagline)}</div></div>
  <div class="facts">${facts}</div>
  <div class="together"><span class="label">${esc(c.together_label || 'Together')}</span><span>${esc(c.together || hh.together)}</span>
    <span class="label">Tonight</span><span class="tonight">${esc(c.tonight || hh.tonight)}</span></div>
  <div class="sec"><span class="label">Your story</span><p>${esc(c.story)}</p></div>
  <div class="bottom"><span class="label">Your bottom line</span><p>${esc(c.bottom_line)}</p></div>
  <div class="give"><span class="label">What you could give</span><ul>${give}</ul></div>
  <div class="ask"><span class="label">${who}</span><q>${esc(c.ask)}</q></div>
  <details class="secret"><summary>A secret: tap to open</summary><div class="body">
    <p class="small">${untold} You decide if and when to reveal it.</p><p>${esc(c.secret)}</p></div></details>
  ${extras()}
  ${footer()}
  </div>`;
}

function route() {
  const id = decodeURIComponent(location.hash.replace(/^#\/?/, '')).toUpperCase();
  let html;
  if (cardById[id]) html = card(id);
  else if (hhById[id]) html = household(id);
  else html = home();
  app.innerHTML = html;
  window.scrollTo(0, 0);
  const t = cardById[id] ? `${id} · ${cardById[id].card.name}` : hhById[id] ? `Household ${id}` : '';
  document.title = (t ? t + ' · ' : '') + D.meta.title;
}
window.addEventListener('hashchange', route);
route();</script>
</body>
</html>
