<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="Role cards for a CCCH9015 classroom game on work and family in Hong Kong.">
<title>Can We Build a Life Together?</title>
<style>:root{
  --bg:#FFFFFF;--ink:#1E2A3B;--muted:#5E6878;--navy:#14285A;--line:#E3E7EE;--panel:#F6F8FB;
  --A:#2457B0;--A-t:#EAF1FB;--B:#A3323A;--B-t:#FBEDEE;--C:#2E6B45;--C-t:#ECF5EE;--D:#A0620F;--D-t:#FCF3E6;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12161D;--ink:#E8ECF2;--muted:#A2ABB9;--navy:#C9D6F5;--line:#2A313C;--panel:#1A2029;
    --A:#8FB2F0;--A-t:#1B2740;--B:#EE9AA0;--B-t:#3A1E22;--C:#8FCFA5;--C-t:#18301F;--D:#E9B86A;--D-t:#3A2A12;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--sans)}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
a{color:inherit}
h1,h2,h3{font-family:var(--serif);color:var(--navy);line-height:1.2;margin:0}
h1{font-size:30px}
h2{font-size:22px;margin:28px 0 10px}
.kicker{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.sub{font-family:var(--serif);font-size:19px;color:var(--muted);margin:6px 0 16px}
.lead{margin:0 0 8px}
ol.steps{padding-left:22px;margin:8px 0}
ol.steps li{margin:6px 0}
ul.parts{padding-left:20px;margin:6px 0}
ul.parts li{margin:4px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 8px}
.hh{display:block;text-decoration:none;border-radius:14px;padding:18px 16px;background:var(--t);border:2px solid var(--a)}
.hh .letter{font-family:var(--serif);font-size:40px;line-height:1;color:var(--a);font-weight:bold}
.hh .lbl{display:block;margin-top:6px;font-size:15px;color:var(--ink)}
.trio{display:block;text-decoration:none;text-align:center;border:1px dashed var(--muted);border-radius:12px;padding:12px;margin:4px 0 12px;color:var(--ink)}
.small{font-size:14px;color:var(--muted)}
.back{display:inline-block;font-size:15px;color:var(--muted);text-decoration:none;margin-bottom:14px}
.back:hover{text-decoration:underline}
.role-btn{display:block;text-decoration:none;border-radius:14px;padding:16px;margin:12px 0;background:var(--t);border:2px solid var(--a)}
.role-btn b{display:block;font-family:var(--serif);font-size:22px;color:var(--a)}
.role-btn span{font-size:15px}
.warn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;margin:12px 0}
.card-head{border-radius:16px;padding:18px 16px;background:var(--t);margin-bottom:10px}
.chip{display:inline-block;font-weight:bold;font-size:14px;color:var(--bg);background:var(--a);border-radius:999px;padding:2px 10px;margin-bottom:8px}
.card-head h1{font-size:32px}
.card-head .role{font-size:17px;color:var(--ink);margin-top:4px}
.tagline{font-family:var(--serif);font-style:italic;color:var(--muted);margin-top:6px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.facts span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:14px}
.together{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 16px;background:var(--panel)}
.label{display:block;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--a);margin-bottom:2px;font-weight:bold}
.together .label + span{display:block;margin-bottom:10px}
.tonight{font-weight:600;display:block;margin-bottom:10px}
ol.options{margin:4px 0 0;padding-left:22px}
ol.options li{margin:4px 0}
.sec{margin:0 0 14px}
.sec p{margin:0}
.bottom{border:2px solid var(--a);border-radius:12px;padding:12px 14px;margin:14px 0}
.bottom p{margin:2px 0 0;font-weight:600}
.give{border-radius:12px;padding:12px 14px;margin:14px 0;background:var(--t)}
.give ul{margin:4px 0 0;padding-left:20px}
.give li{margin:4px 0}
.ask{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0}
.ask q{font-family:var(--serif);font-size:19px;quotes:"“" "”"}
details{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:var(--bg)}
summary{cursor:pointer;padding:12px 14px;font-weight:600;color:var(--navy);list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";float:right;color:var(--muted)}
details[open] summary::after{content:"−"}
details .body{padding:0 14px 12px}
details ol,details ul{padding-left:20px;margin:6px 0}
details li{margin:6px 0}
.timing{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.timing span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:6px 0}
.opt b{font-family:var(--serif);color:var(--navy)}
footer{margin-top:28px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}</style>
</head>

<script>const D = JSON.parse(document.getElementById('data').textContent);
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
  .replace(/(\d)–(\d)/g, '$1⁠–⁠$2')
  .replace(/(\d) (am|pm)\b/g, '$1 $2')
  .replace(/(\d) sq ft/g, '$1 sq ft');
const hhById = Object.fromEntries(D.households.map(h => [h.id, h]));
const cardById = {};
D.households.forEach(h => h.cards.forEach(c => cardById[c.id] = {hh: h, card: c}));
const vars = id => `--a:var(--${id});--t:var(--${id}-t)`;

function extras() {
  const rounds = D.rounds.map(r =>
    `<li><b>${esc(r.title)}</b> <span class="small">· ${esc(r.time)}</span><br>${esc(r.text)}</li>`).join('');
  const must = D.deal_must_say.map(q => `<li>${esc(q)}</li>`).join('');
  const rules = D.rules.map(r => `<li><b>${esc(r.title)}.</b> ${esc(r.text)}</li>`).join('');
  const check = D.check_deal.items.map(s => `<li>${esc(s)}</li>`).join('');
  const opts = D.decision.options.map(o => `<b>${esc(o[0])}</b><span>${esc(o[1])}</span>`).join('');
  return `
  <details><summary>How the conversation goes</summary><div class="body"><ol>${rounds}</ol>
    <p><b>Your deal must say:</b></p><ul>${must}</ul></div></details>
  <details><summary>Three rules</summary><div class="body"><ol>${rules}</ol></div></details>
  <details><summary>${esc(D.check_deal.title)}</summary><div class="body"><ul>${check}</ul></div></details>
  <details><summary>${esc(D.decision.title)}</summary><div class="body"><div class="opt">${opts}</div>
    <p>${esc(D.decision.after)}</p></div></details>`;
}

function footer() {
  return `<footer>${esc(D.meta.course_line)}<br>${esc(D.disclaimer)}</footer>`;
}

function home() {
  const steps = D.howto.map(s => `<li>${esc(s)}</li>`).join('');
  const tiles = D.households.map(h =>
    `<a class="hh" style="${vars(h.id)}" href="#${h.id}"><span class="letter">${h.id}</span>
     <span class="lbl">Household ${h.id}</span></a>`).join('');
  const parts = D.card_parts.map(p => `<li><b>${esc(p[0])}:</b> ${esc(p[1])}</li>`).join('');
  const timing = D.timing.map(t => `<span>${esc(t[0])} · ${esc(t[1])}</span>`).join('');
  return `
  <p class="kicker">${esc(D.meta.course_line)}</p>
  <h1>${esc(D.meta.title)}</h1>
  <p class="sub">${esc(D.meta.subtitle)}</p>
  <p class="lead">${esc(D.lead)}</p>
  <h2>Find your card</h2>
  <ol class="steps">${steps}</ol>
  <div class="grid">${tiles}</div>
  <a class="trio" href="#C">Household of three? Open <b>Household C</b>.</a>
  <p class="small">${esc(D.backup_rule)}</p>
  <h2>Your card</h2>
  <ul class="parts">${parts}</ul>
  <div class="timing">${timing}</div>
  ${extras()}
  ${footer()}`;
}

function household(id) {
  const h = hhById[id];
  const seat = ['I’m sitting on the LEFT', 'I’m sitting on the RIGHT', 'Household of three only: the third person'];
  const btns = h.cards.map((c, i) =>
    `<a class="role-btn" style="${vars(id)}" href="#${c.id}"><b>Card ${i + 1}</b><span>${seat[i]}</span></a>`).join('');
  return `
  <a class="back" href="#">← All households</a>
  <p class="kicker">${esc(D.meta.title)}</p>
  <h1>Household ${id}</h1>
  <div class="warn">Open <b>only your own card</b>. Don’t show your screen: introduce yourself to your partner in character.</div>
  ${btns}
  ${footer()}`;
}

function card(id) {
  const {hh, card: c} = cardById[id];
  const facts = c.facts.map(f => `<span>${esc(f)}</span>`).join('');
  const options = (c.options || hh.options).map(o => `<li>${esc(o)}</li>`).join('');
  const give = c.give.map(g => `<li>${esc(g)}</li>`).join('');
  const who = c.ask_to === 'both of them' ? 'Ask both of them' : `Ask ${esc(c.ask_to)}`;
  return `
  <div style="${vars(hh.id)}">
  <a class="back" href="#${hh.id}">← Household ${hh.id}</a>
  <div class="card-head"><span class="chip">${c.id}</span>
    <h1>${esc(c.name)}, ${c.age}</h1><div class="role">${esc(c.role)}</div>
    <div class="tagline">${esc(c.tagline)}</div></div>
  <div class="facts">${facts}</div>
  <div class="together"><span class="label">${esc(c.together_label || 'Together')}</span><span>${esc(c.together || hh.together)}</span>
    <span class="label">Tonight’s question</span><span class="tonight">${esc(c.question || hh.question)}</span>
    <span class="label">The options</span><ol class="options">${options}</ol></div>
  <div class="sec"><span class="label">Your story</span><p>${esc(c.story)}</p></div>
  <div class="sec"><span class="label">What you want</span><p>${esc(c.want)}</p></div>
  <div class="bottom"><span class="label">Your bottom line</span><p>${esc(c.bottom_line)}</p></div>
  <div class="give"><span class="label">What you could give</span><ul>${give}</ul></div>
  <div class="ask"><span class="label">${who}</span><q>${esc(c.ask)}</q></div>
  ${extras()}
  ${footer()}
  </div>`;
}

function route() {
  const id = decodeURIComponent(location.hash.replace(/^#\/?/, '')).toUpperCase();
  let html;
  if (cardById[id]) html = card(id);
  else if (hhById[id]) html = household(id);
  else html = home();
  app.innerHTML = html;
  window.scrollTo(0, 0);
  const t = cardById[id] ? `${id} · ${cardById[id].card.name}` : hhById[id] ? `Household ${id}` : '';
  document.title = (t ? t + ' · ' : '') + D.meta.title;
}
window.addEventListener('hashchange', route);
route();</script>
</body>
</html>
